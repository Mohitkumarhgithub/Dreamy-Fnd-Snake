<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dreamy Snake - 2 Player Battle</title>
<meta name="theme-color" content="#172554">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
    body {
        --bg-grad: linear-gradient(135deg, #0b1230 0%, #172554 45%, #2a1b4d 100%);
        --b1: #7c5cff; --b2: #00b4d8; --b3: #ff5fa2; --b4: #3a86ff; --b5: #2de2a6; --blob-op: 0.55;
        --text: #ffffff; --tshadow: 0 2px 4px rgba(0,0,0,0.3);
        --glass-a: rgba(255,255,255,0.18); --glass-b: rgba(255,255,255,0.05); --glass-border: rgba(255,255,255,0.3);
        --canvas-bg: rgba(6,10,32,0.65); --grid: rgba(255,255,255,0.045);
        --chip: rgba(0,0,0,0.35); --sel-bg: rgba(255,255,255,0.18); --opt: #172554;
    }
    body[data-theme="blush"] {
        --bg-grad: linear-gradient(45deg, #ff9a9e 0%, #fad0c4 99%);
        --b1: #ffb3c1; --b2: #ffd6a5; --b3: #fbc2eb; --b4: #cdb4db; --b5: #ffc8dd; --blob-op: 0.8;
        --text: #4a2030; --tshadow: 0 1px 0 rgba(255,255,255,0.6);
        --glass-a: rgba(255,255,255,0.5); --glass-b: rgba(255,255,255,0.22); --glass-border: rgba(255,255,255,0.75);
        --canvas-bg: rgba(60,25,45,0.78); --grid: rgba(255,255,255,0.07);
        --chip: rgba(255,255,255,0.55); --sel-bg: rgba(255,255,255,0.7); --opt: #ffd6dc;
    }
    body[data-theme="flower"] {
        --bg-grad: linear-gradient(135deg, #14301f 0%, #25513a 50%, #4a3358 100%);
        --b1: #7bd389; --b2: #ff9ecb; --b3: #ffd6e8; --b4: #a8e6a1; --b5: #c9a7ff; --blob-op: 0.5;
        --canvas-bg: rgba(8,30,18,0.66); --opt: #25513a;
    }
    body[data-theme="ocean"] {
        --bg-grad: linear-gradient(135deg, #031c2c 0%, #05405f 50%, #0a6c8f 100%);
        --b1: #00b4d8; --b2: #48cae4; --b3: #0077b6; --b4: #90e0ef; --b5: #3a86ff; --blob-op: 0.5;
        --canvas-bg: rgba(2,18,34,0.68); --opt: #05405f;
    }
    body[data-theme="rose"] {
        --bg-grad: linear-gradient(135deg, #34183f 0%, #5e2a55 50%, #8f3f69 100%);
        --b1: #ff8fab; --b2: #fb6f92; --b3: #ffc2d1; --b4: #cdb4db; --b5: #ffafcc; --blob-op: 0.5;
        --canvas-bg: rgba(36,10,36,0.66); --opt: #5e2a55;
    }
    body[data-theme="iron"] {
        --bg-grad: linear-gradient(135deg, #0e1319 0%, #1c2733 50%, #12302c 100%);
        --b1: #2a9d8f; --b2: #457b9d; --b3: #264653; --b4: #e9c46a; --b5: #3d5a80; --blob-op: 0.45;
        --canvas-bg: rgba(6,10,14,0.72); --opt: #1c2733;
    }

    html, body {
        margin: 0; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    body {
        display: flex; align-items: center; justify-content: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-grad);
    }

    .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
    .bg span {
        position: absolute; border-radius: 50%; filter: blur(40px); opacity: var(--blob-op);
        animation: floatBlob 18s infinite alternate ease-in-out; will-change: transform;
    }
    .bg span:nth-child(1) { width: 45vmax; height: 45vmax; background: var(--b1); top: -12%; left: -10%; }
    .bg span:nth-child(2) { width: 38vmax; height: 38vmax; background: var(--b2); top: 35%; right: -12%; animation-duration: 24s; }
    .bg span:nth-child(3) { width: 34vmax; height: 34vmax; background: var(--b3); bottom: -14%; left: 15%; animation-duration: 21s; }
    @keyframes floatBlob {
        0% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(6vmax, -5vmax) scale(1.1); }
        100% { transform: translate(-5vmax, 6vmax) scale(0.95); }
    }

    .game-container {
        margin-top: 10px; position: relative; display: flex; flex-direction: column; box-sizing: border-box;
        width: min(calc(100vw - 16px), 620px); height: calc(100vh - 16px); height: min(calc(100dvh - 16px), 900px);
        padding: 12px; background: linear-gradient(135deg, var(--glass-a), var(--glass-b));
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border); border-radius: 28px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.45);
        text-align: center; transition: box-shadow 0.3s ease;
    }

    .header-bar {
        flex: none; display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 8px; color: var(--text); font-weight: bold; text-shadow: var(--tshadow); font-size: 16px;
    }

    .controls-bar {
        flex: none; display: flex; justify-content: center; align-items: center; flex-wrap: wrap;
        gap: 6px; margin-bottom: 8px; color: var(--text); font-size: 12px; font-weight: 600;
    }
    select {
        background: var(--sel-bg); border: 1px solid var(--glass-border); color: var(--text);
        padding: 4px 6px; border-radius: 8px; font-weight: bold; font-size: 12px; outline: none; cursor: pointer;
    }
    select option { background: var(--opt); color: var(--text); }

    .stage { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .board { position: relative; width: 300px; height: 300px; }
    canvas {
        width: 100%; height: 100%; display: block; background-color: var(--canvas-bg);
        background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 5% 5%; border: 1px solid rgba(255,255,255,0.18); border-radius: 18px; box-sizing: border-box;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
    }

    .overlay-msg {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
        width: 80%; box-sizing: border-box; background: rgba(0,0,0,0.85); color: #fff;
        padding: 16px 18px; border-radius: 18px; font-size: clamp(14px, 4vw, 18px); font-weight: 700; line-height: 1.4;
        pointer-events: none; opacity: 0; transition: opacity 0.3s ease, transform 0.3s ease;
        border: 1px solid rgba(255,255,255,0.2); z-index: 10;
    }
    .overlay-msg.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    #game-over {
        position: absolute; inset: 0; background: rgba(0,0,0,0.85); border-radius: 18px;
        display: none; flex-direction: column; align-items: center; justify-content: center;
        color: #fff; z-index: 20; padding: 16px; box-sizing: border-box;
    }
    #game-over h2 { font-size: clamp(22px, 6vw, 30px); margin: 0 0 8px; color: #ff4d4d; }
    #winner-announcement { font-size: 18px; color: #ffd166; font-weight: bold; margin-bottom: 10px; }
    .series-score { font-size: 15px; background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 12px; margin-bottom: 10px; }
    #restart-msg { font-size: 13px; background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 15px; }

    .pad-wrap { flex: none; display: none; justify-content: space-between; padding: 6px 10px; }
    body[data-control="buttons"] .pad-wrap { display: flex; }
    .player-pad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(2, 45px); gap: 6px; }
    .d-btn {
        background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.45); border-radius: 12px;
        color: var(--text); font-size: 18px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .d-btn:active { background: rgba(255,255,255,0.5); }
    .p1-up { grid-column: 2; grid-row: 1; } .p1-left { grid-column: 1; grid-row: 2; } .p1-down { grid-column: 2; grid-row: 2; } .p1-right { grid-column: 3; grid-row: 2; }
</style>
</head>
<body data-control="buttons">

<div class="bg"><span></span><span></span><span></span></div>

<div class="game-container" id="container">
    <div class="header-bar" id="hud">
        <div id="hud-p1">🟦 P1: <span id="score1">0</span></div>
        <div id="hud-center">🎯 Target: 25</div>
        <div id="hud-p2">🟪 P2: <span id="score2">0</span></div>
    </div>

    <div class="controls-bar">
        <span>Mode:</span>
        <select id="modeSelect">
            <option value="solo">🐍 Solo Mode</option>
            <option value="duo" selected>⚔️ 2-Player Local Battle</option>
        </select>
        <span>Mood:</span>
        <select id="themeSelect">
            <option value="midnight">🌙 Midnight Calm</option>
            <option value="ocean">🌊 Ocean Breeze</option>
            <option value="iron">⚡ Iron Focus</option>
        </select>
    </div>

    <div class="stage" id="stage">
        <div class="board" id="board">
            <canvas id="game" width="400" height="400"></canvas>
            <div id="start-hint" class="overlay-msg active">Tap any button or key to start!</div>
            <div id="game-over">
                <h2 id="go-title">ROUND OVER</h2>
                <div id="winner-announcement"></div>
                <div class="series-score" id="series-score-text">Series: P1 [0] - [0] P2</div>
                <p id="restart-msg">Tap or press key for next round</p>
            </div>
        </div>
    </div>

    <!-- Dual On-Screen D-Pads for 2-Player Same Device -->
    <div class="pad-wrap">
        <div>
            <div style="font-size:11px; color:#00ffff; margin-bottom:2px; font-weight:bold;">PLAYER 1 (Blue)</div>
            <div class="player-pad">
                <div class="d-btn" data-p="1" data-dir="U">▲</div>
                <div class="d-btn" data-p="1" data-dir="L">◀</div>
                <div class="d-btn" data-p="1" data-dir="D">▼</div>
                <div class="d-btn" data-p="1" data-dir="R">▶</div>
            </div>
        </div>
        <div>
            <div style="font-size:11px; color:#ff70a6; margin-bottom:2px; font-weight:bold;">PLAYER 2 (Pink)</div>
            <div class="player-pad">
                <div class="d-btn" data-p="2" data-dir="U">▲</div>
                <div class="d-btn" data-p="2" data-dir="L">◀</div>
                <div class="d-btn" data-p="2" data-dir="D">▼</div>
                <div class="d-btn" data-p="2" data-dir="R">▶</div>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d", { alpha: false });
    const stage = document.getElementById("stage");
    const board = document.getElementById("board");
    const score1El = document.getElementById("score1");
    const score2El = document.getElementById("score2");
    const modeSelect = document.getElementById("modeSelect");
    const themeSelect = document.getElementById("themeSelect");
    const hintEl = document.getElementById("start-hint");
    const gameOverEl = document.getElementById("game-over");
    const winnerAnnounceEl = document.getElementById("winner-announcement");
    const seriesScoreText = document.getElementById("series-score-text");

    const grid = 20;
    const WINNING_SCORE = 25; // First to 25 balls wins the match/round!
    let gameMode = "duo";
    let score1 = 0, score2 = 0;
    let seriesWins1 = 0, seriesWins2 = 0;
    let started = false, isGameOver = false;
    let count = 0;
    let inputQueue1 = [], inputQueue2 = [];

    let snake1 = { x: 80, y: 160, dx: grid, dy: 0, cells: [], maxCells: 4, color: "#00b4d8" };
    let snake2 = { x: 300, y: 160, dx: -grid, dy: 0, cells: [], maxCells: 4, color: "#ff5fa2" };
    let ball = { x: 200, y: 200 };

    const THEMES = {
        midnight: { bg: "rgba(6,10,32,0.75)", glow: "#ff3b6b" },
        ocean: { bg: "rgba(2,18,34,0.78)", glow: "#90e0ef" },
        iron: { bg: "rgba(6,10,14,0.82)", glow: "#e9c46a" }
    };
    let currentTheme = THEMES.midnight;

    function fit() {
        const s = Math.floor(Math.min(stage.clientWidth, stage.clientHeight));
        if (s > 80) { board.style.width = s + "px"; board.style.height = s + "px"; }
    }
    new ResizeObserver(fit).observe(stage);
    window.addEventListener("resize", fit);

    function resetGame() {
        score1 = 0; score2 = 0;
        score1El.innerText = score1;
        score2El.innerText = score2;
        
        snake1.x = 80; snake1.y = 160; snake1.dx = grid; snake1.dy = 0; snake1.maxCells = 4;
        snake1.cells = [0, 1, 2, 3].map(i => ({ x: 80 - i * grid, y: 160 }));
        
        if (gameMode === "duo") {
            snake2.x = 300; snake2.y = 160; snake2.dx = -grid; snake2.dy = 0; snake2.maxCells = 4;
            snake2.cells = [0, 1, 2, 3].map(i => ({ x: 300 + i * grid, y: 160 }));
        }

        inputQueue1 = []; inputQueue2 = [];
        isGameOver = false; started = false;
        gameOverEl.style.display = "none";
        hintEl.innerText = gameMode === "duo" ? "P1: W/A/S/D | P2: Arrow Keys" : "Use arrow keys or buttons to start";
        hintEl.classList.add("active");
        placeBall();
    }

    function placeBall() {
        let x, y, tries = 0;
        do {
            x = Math.floor(Math.random() * (canvas.width / grid)) * grid;
            y = Math.floor(Math.random() * (canvas.height / grid)) * grid;
            tries++;
        } while (tries < 100 && (
            snake1.cells.some(c => c.x === x && c.y === y) ||
            (gameMode === "duo" && snake2.cells.some(c => c.x === x && c.y === y))
        ));
        ball.x = x; ball.y = y;
    }

    function triggerRoundOver(winner) {
        isGameOver = true;
        if (winner === 1) seriesWins1++;
        else if (winner === 2) seriesWins2++;
        else {
            if (score1 > score2) seriesWins1++;
            else if (score2 > score1) seriesWins2++;
        }

        winnerAnnounceEl.innerText = gameMode === "solo" ? `Score: ${score1}` : (winner ? `🎉 Player ${winner} Wins the Round!` : `It's a Tie!`);
        seriesScoreText.innerText = `Best of Series: P1 [${seriesWins1}] - [${seriesWins2}] P2`;
        gameOverEl.style.display = "flex";
    }

    function step() {
        // P1 Controls Queue
        if (inputQueue1.length > 0) {
            const d = inputQueue1.shift();
            if (d === 'L' && snake1.dx === 0) { snake1.dx = -grid; snake1.dy = 0; }
            if (d === 'U' && snake1.dy === 0) { snake1.dy = -grid; snake1.dx = 0; }
            if (d === 'R' && snake1.dx === 0) { snake1.dx = grid; snake1.dy = 0; }
            if (d === 'D' && snake1.dy === 0) { snake1.dy = grid; snake1.dx = 0; }
        }

        // P2 Controls Queue (Only in Duo Mode)
        if (gameMode === "duo" && inputQueue2.length > 0) {
            const d = inputQueue2.shift();
            if (d === 'L' && snake2.dx === 0) { snake2.dx = -grid; snake2.dy = 0; }
            if (d === 'U' && snake2.dy === 0) { snake2.dy = -grid; snake2.dx = 0; }
            if (d === 'R' && snake2.dx === 0) { snake2.dx = grid; snake2.dy = 0; }
            if (d === 'D' && snake2.dy === 0) { snake2.dy = grid; snake2.dx = 0; }
        }

        // Move Snake 1
        snake1.x += snake1.dx; snake1.y += snake1.dy;
        if (snake1.x < 0) snake1.x = canvas.width - grid; else if (snake1.x >= canvas.width) snake1.x = 0;
        if (snake1.y < 0) snake1.y = canvas.height - grid; else if (snake1.y >= canvas.height) snake1.y = 0;
        snake1.cells.unshift({ x: snake1.x, y: snake1.y });
        if (snake1.cells.length > snake1.maxCells) snake1.cells.pop();

        // Move Snake 2 (if Duo)
        if (gameMode === "duo") {
            snake2.x += snake2.dx; snake2.y += snake2.dy;
            if (snake2.x < 0) snake2.x = canvas.width - grid; else if (snake2.x >= canvas.width) snake2.x = 0;
            if (snake2.y < 0) snake2.y = canvas.height - grid; else if (snake2.y >= canvas.height) snake2.y = 0;
            snake2.cells.unshift({ x: snake2.x, y: snake2.y });
            if (snake2.cells.length > snake2.maxCells) snake2.cells.pop();
        }

        // Check Ball Eating (Shared Ball!)
        if (snake1.x === ball.x && snake1.y === ball.y) {
            snake1.maxCells++; score1 += 10; score1El.innerText = score1;
            placeBall();
            if (score1 >= WINNING_SCORE) { triggerRoundOver(1); return; }
        }
        if (gameMode === "duo" && snake2.x === ball.x && snake2.y === ball.y) {
            snake2.maxCells++; score2 += 10; score2El.innerText = score2;
            placeBall();
            if (score2 >= WINNING_SCORE) { triggerRoundOver(2); return; }
        }

        // Collisions: P1 self or P2 collision
        for (let i = 4; i < snake1.cells.length; i++) {
            if (snake1.cells[i].x === snake1.x && snake1.cells[i].y === snake1.y) { triggerRoundOver(gameMode === "duo" ? 2 : 1); return; }
        }
        if (gameMode === "duo") {
            for (let i = 4; i < snake2.cells.length; i++) {
                if (snake2.cells[i].x === snake2.x && snake2.cells[i].y === snake2.y) { triggerRoundOver(1); return; }
            }
            // Head-on collision or crashing into each other's bodies
            if (snake1.cells.some(c => c.x === snake2.x && c.y === snake2.y)) { triggerRoundOver(1); return; }
            if (snake2.cells.some(c => c.x === snake1.x && c.y === snake1.y)) { triggerRoundOver(2); return; }
        }
    }

    function draw() {
        ctx.fillStyle = currentTheme.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Shared Ball
        ctx.shadowBlur = 18; ctx.shadowColor = currentTheme.glow;
        ctx.fillStyle = currentTheme.glow;
        ctx.beginPath(); ctx.arc(ball.x + grid/2, ball.y + grid/2, 8, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;

        // Draw Snake 1 (Blue)
        snake1.cells.forEach((cell, idx) => {
            ctx.fillStyle = idx === 0 ? "#00b4d8" : "#0077b6";
            ctx.beginPath(); ctx.arc(cell.x + grid/2, cell.y + grid/2, idx === 0 ? 10 : 8, 0, Math.PI*2); ctx.fill();
        });

        // Draw Snake 2 (Pink - Duo Mode Only)
        if (gameMode === "duo") {
            snake2.cells.forEach((cell, idx) => {
                ctx.fillStyle = idx === 0 ? "#ff5fa2" : "#b5179e";
                ctx.beginPath(); ctx.arc(cell.x + grid/2, cell.y + grid/2, idx === 0 ? 10 : 8, 0, Math.PI*2); ctx.fill();
            });
        }
    }

    function loop() {
        requestAnimationFrame(loop);
        if (++count < 6) return; // Game speed
        count = 0;
        if (!isGameOver && started) step();
        draw();
    }

    // Keyboard Controls: P1 = W/A/S/D, P2 = Arrow Keys
    document.addEventListener("keydown", e => {
        const k = e.key.toLowerCase();
        if (["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"," "].includes(k)) e.preventDefault();

        if (isGameOver) { resetGame(); return; }
        if (!started) { started = true; hintEl.classList.remove("active"); }

        // P1 keys (W, A, S, D)
        if (k === "a") inputQueue1.push('L');
        if (k === "w") inputQueue1.push('U');
        if (k === "d") inputQueue1.push('R');
        if (k === "s") inputQueue1.push('D');

        // P2 keys (Arrow Keys)
        if (gameMode === "duo") {
            if (k === "arrowleft") inputQueue2.push('L');
            if (k === "arrowup") inputQueue2.push('U');
            if (k === "arrowright") inputQueue2.push('R');
            if (k === "arrowdown") inputQueue2.push('D');
        } else {
            // In solo mode, arrow keys also control P1
            if (k === "arrowleft") inputQueue1.push('L');
            if (k === "arrowup") inputQueue1.push('U');
            if (k === "arrowright") inputQueue1.push('R');
            if (k === "arrowdown") inputQueue1.push('D');
        }
    });

    // Touch D-Pad Controls for mobile buttons
    document.querySelectorAll(".d-btn").forEach(btn => {
        btn.addEventListener("pointerdown", e => {
            e.preventDefault();
            if (!started) { started = true; hintEl.classList.remove("active"); }
            if (isGameOver) { resetGame(); return; }

            const p = btn.dataset.p;
            const dir = btn.dataset.dir;
            if (p === "1") inputQueue1.push(dir);
            if (p === "2" && gameMode === "duo") inputQueue2.push(dir);
        });
    });

    modeSelect.addEventListener("change", () => {
        gameMode = modeSelect.value;
        document.getElementById("hud-p2").style.display = gameMode === "duo" ? "block" : "none";
        document.querySelector(".pad-wrap").style.display = gameMode === "duo" ? "flex" : "none";
        resetGame();
    });

    themeSelect.addEventListener("change", () => { currentTheme = THEMES[themeSelect.value]; });

    resetGame();
    requestAnimationFrame(loop);
</script>
</body>
</html>
